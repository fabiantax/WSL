# =============================================================================
# WSL2 Configuration - Solving VHDX Growth + Port Forwarding + Performance
# =============================================================================
#
# INSTALL:
#   Copy to: C:\Users\<username>\.wslconfig
#   Then:    wsl --shutdown && wsl
#
# This configuration:
#   1. Enables mirrored networking (eliminates port forwarding)
#   2. Enables sparse VHD (helps with VHDX growth)
#   3. Maximizes performance for Strix Halo
#
# =============================================================================

[wsl2]
# -----------------------------------------------------------------------------
# NETWORKING - Mirrored Mode (SOLVES PORT FORWARDING)
# -----------------------------------------------------------------------------
# Your WSL2 services are now accessible at localhost from Windows!
# No more: netsh interface portproxy add v4tov4 ...
networkingMode=mirrored

# Better VPN compatibility
dnsTunneling=true

# Inherit Windows proxy settings
autoProxy=true

# Windows firewall integration (allows LAN access to WSL2 services)
firewall=true

# Localhost forwarding (kept for compatibility)
localhostForwarding=true

# -----------------------------------------------------------------------------
# MEMORY - Optimized for Strix Halo (128GB UMA)
# -----------------------------------------------------------------------------
# Give WSL2 plenty of RAM - you have 128GB!
memory=64GB

# All 16 Zen 5 cores
processors=16

# Disable swap (you have enough RAM)
swap=0

# Return unused memory to Windows
autoMemoryReclaim=gradual
pageReporting=true

# -----------------------------------------------------------------------------
# STORAGE - VHDX Growth Mitigation
# -----------------------------------------------------------------------------
# Sparse VHD: Allows automatic space reclamation
# NOTE: This helps but doesn't fully solve VHDX growth
# BETTER SOLUTION: Use NVMe passthrough (see setup script below)
sparseVhd=true

# -----------------------------------------------------------------------------
# PERFORMANCE - Maximum Throughput
# -----------------------------------------------------------------------------
# Enable nested virtualization (for Docker, etc.)
nestedVirtualization=true

# Don't idle timeout
vmIdleTimeout=65535

# Kernel command line optimizations
# WARNING: mitigations=off disables Spectre/Meltdown protections
# Remove if security is a concern
kernelCommandLine=transparent_hugepage=always

# Custom kernel (uncomment after building Strix-Turbo kernel)
# kernel=C:\\Users\\<username>\\wsl-kernels\\bzImage-strix-zen5

# -----------------------------------------------------------------------------
# EXPERIMENTAL FEATURES
# -----------------------------------------------------------------------------
[experimental]
# Sparse VHD (redundant but some versions need this)
sparseVhd=true

# Host address loopback
hostAddressLoopback=true

# Automatic VHDX compaction (Windows 11 23H2+)
autoMemoryReclaim=dropcache

# =============================================================================
# WHAT THIS DOESN'T FIX:
# =============================================================================
#
# 1. VHDX Growth: sparseVhd helps but doesn't fully solve it
#    SOLUTION: Use NVMe passthrough (see below)
#
# 2. ROCm Performance: Still ~2x slower than native Linux
#    SOLUTION: Use native Linux for GPU workloads
#
# 3. NPU Access: NOT AVAILABLE in WSL2
#    SOLUTION: Native Linux only (kernel 6.14+)
#
# =============================================================================
# RECOMMENDED: NVMe PASSTHROUGH SETUP
# =============================================================================
#
# To completely eliminate VHDX:
#
# 1. Create a partition on your NVMe (leave unformatted)
#    - Use Windows Disk Management
#    - Note the disk number (e.g., \\.\PHYSICALDRIVE1)
#
# 2. Mount bare and format from WSL2:
#    wsl --mount \\.\PHYSICALDRIVE1 --partition 2 --bare
#    sudo mkfs.ext4 /dev/sdc
#
# 3. Create startup script (run as admin):
#    wsl --mount \\.\PHYSICALDRIVE1 --partition 2 --type ext4
#
# 4. Add to /etc/fstab in WSL2:
#    /dev/sdc /home/user/repos ext4 defaults 0 2
#
# Your repos now live on native NVMe, not VHDX!
#
# =============================================================================
